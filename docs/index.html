<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crop & Convert to WEBP</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="googlebot" content="noindex, nofollow" />
    <style>
      :root {
        --bg: #0d0d0d;
        --panel: #171717;
        --ink: #e8e8e8;
        --muted: #9a9a9a;
        --line: #2f2f2f;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        padding: 32px 16px;
        background:
          radial-gradient(circle at top left, rgba(107, 143, 163, 0.16), transparent 24%),
          linear-gradient(180deg, #0d0d0d 0%, #111111 100%);
        color: var(--ink);
        font-family: "JetBrains Mono", "IBM Plex Sans", "Consolas", sans-serif;
      }

      main {
        width: min(760px, 100%);
        margin: 0 auto;
        padding: 24px;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: rgba(23, 23, 23, 0.92);
      }

      h1 {
        margin: 0 0 10px;
        font-size: clamp(28px, 5vw, 40px);
        line-height: 1.05;
      }

      p {
        margin: 0 0 18px;
        color: var(--muted);
        line-height: 1.65;
      }

      a {
        color: #d8e4eb;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Crop &amp; Convert to WEBP</h1>
      <p>
        Public privacy page for the Chrome extension.
      </p>
      <p>
        <a href="./privacy/">Open the privacy policy</a>
      </p>
    </main>
  </body>
</html>
